<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        
        .category-card {
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .category-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 32px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .category-card.selected {
            transform: scale(0.98);
        }

        .category-card.selected::after {
            border-color: theme('colors.primary');
            box-shadow: inset 0 0 20px rgba(129, 39, 207, 0.15), 0 0 30px rgba(129, 39, 207, 0.2);
        }

        .category-card .check-icon {
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .category-card.selected .check-icon {
            opacity: 1;
            transform: scale(1);
        }

        .category-card img {
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .category-card:hover img {
            transform: scale(1.05);
        }
        
        .continue-btn {
            transition: all 0.3s ease;
        }
        
        .continue-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .luminous-shadow {
            box-shadow: 0 40px 80px -20px rgba(129, 39, 207, 0.08);
        }
        
        /* Floating Action Bar Container */
        .fab-container {
            backdrop-filter: blur(40px);

<script>
        let selectedCount = 0;
        const requiredCount = 3;
        const countDisplay = document.getElementById('selectedCount');
        const continueBtn = document.getElementById('continueBtn');

        function toggleSelection(element) {
            const isSelected = element.classList.contains('selected');
            
            if (isSelected) {
                element.classList.remove('selected');
                selectedCount--;
            } else {
                element.classList.add('selected');
                selectedCount++;
            }
            
            updateUI();
        }

        function updateUI() {
            // Update counter
            countDisplay.textContent = selectedCount;
            
            // Pulse animation on counter
            countDisplay.classList.add('scale-110');
            setTimeout(() => {
                countDisplay.classList.remove('scale-110');
                countDisplay.style.transition = 'transform 0.2s ease';
            }, 150);

            // Update button state
            if (selectedCount >= requiredCount) {
                continueBtn.disabled = false;
                continueBtn.classList.add('bg-primary-container', 'text-on-primary-container');
                continueBtn.classList.remove('bg-surface-variant', 'text-on-surface-variant');
            } else {
                continueBtn.disabled = true;
                continueBtn.classList.remove('bg-primary-container', 'text-on-primary-container');
                continueBtn.classList.add('bg-surface-variant', 'text-on-surface-variant');
            }
        }
    </script>
