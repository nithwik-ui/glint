<style>
        /* Base Styles & Animations */
        body {
            background-color: #fff7fe; /* background */
            color: #1f1a23; /* on-background */
            overflow: hidden;
            touch-action: none;
        }

        .luminous-shadow {
            box-shadow: 0 0 80px 10px rgba(129,39,207,0.08); /* primary color tint */
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* Float Animations for Background Cards */
        @keyframes float-1 {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-20px) rotate(1deg); }
        }
        @keyframes float-2 {
            0%, 100% { transform: translateY(0) rotate(3deg); }
            50% { transform: translateY(-30px) rotate(-1deg); }
        }
        @keyframes float-3 {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.02); }
        }

        .bg-card-1 { animation: float-1 8s ease-in-out infinite; }
        .bg-card-2 { animation: float-2 12s ease-in-out infinite; }
        .bg-card-3 { animation: float-3 10s ease-in-out infinite; }
        .bg-card-4 { animation: float-1 14s ease-in-out infinite reverse; }
        
        /* Spinner */
        .spinner-ring {
            stroke-dasharray: 283;
            stroke-dashoffset: 283;
            animation: dash 2s ease-in-out infinite, rotate 2s linear infinite;
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        @keyframes dash {
            0% { stroke-dashoffset: 283; }
            50% { stroke-dashoffset: 70; transform: rotate(45deg); }
            100% { stroke-dashoffset: 283; transform: rotate(360deg); }
        }

        /* Pulse glow */
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }
        .glow-effect {
            animation: pulse-glow 4s ease-in-out infinite;
        }

        /* Text Crossfade */
        .status-text {
            position: absolute;
            width: 100%;
            text-align: center;
            opacity: 0;
            transition: opacity 0.8s ease-in-out, transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform: translateY(10px);
        }
        .status-text.active {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* Final State Transition */
        #loading-container {
            transition: opacity 1s ease-in-out, transform 1s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        #success-container {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95);
            transition: opacity 1s ease-in-out, transform 1s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .show-success #loading-container {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }
        .show-success #success-container {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

    </style>

<button class="w-full bg-primary hover:bg-primary/90 text-on-primary font-title-sm text-title-sm py-4 rounded-full transition-transform active:scale-95 shadow-[0_10px_30px_rgba(129,39,207,0.2)]">

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const statusMessages = document.querySelectorAll('.status-text');
            let currentIndex = 0;
            const messageDuration = 2000; // time per message

            // Rotate messages
            const interval = setInterval(() => {
                statusMessages[currentIndex].classList.remove('active');
                currentIndex++;

                if (currentIndex < statusMessages.length) {
                    statusMessages[currentIndex].classList.add('active');
                } else {
                    // All messages shown, trigger finish
                    clearInterval(interval);
                    setTimeout(() => {
                        document.body.classList.add('show-success');
                    }, 500); // slight delay after last message
                }
            }, messageDuration);
        });
    </script>
