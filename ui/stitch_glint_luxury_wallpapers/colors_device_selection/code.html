                      "secondary": "#6f5092",

                      "error": "#ba1a1a",

                      "on-tertiary-fixed-variant": "#604100",

                      "on-error": "#ffffff",

<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            -webkit-tap-highlight-color: transparent;
        }
        
        .color-option {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            cursor: pointer;
        }

        .color-option::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid theme('colors.primary');
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .color-option.selected {
            transform: scale(0.9);
        }

        .color-option.selected::after {
            opacity: 1;
            transform: scale(1.1);
        }

        .color-option.selected .check-icon {
            opacity: 1;
            transform: scale(1);
        }

        .check-icon {
            opacity: 0;
            transform: scale(0);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .device-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid theme('colors.outline-variant');
            cursor: pointer;
        }

        .device-card.selected {
            border-color: theme('colors.primary');
            background-color: theme('colors.primary-container');
            color: theme('colors.on-primary-container');
            box-shadow: 0 10px 40px rgba(129, 39, 207, 0.15);
            transform: translateY(-2px);
        }

        .device-card.selected .device-icon {
            color: theme('colors.on-primary-container');
        }

        .device-icon {
            transition: color 0.3s ease;
        }

        /* Luminous Shadow for floating effect */
        .luminous-shadow {
            box-shadow: 0 20px 50px rgba(129, 39, 207, 0.05);
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background-color: theme('colors.surface-variant');
            border-radius: 2px;
            overflow: hidden;
        }
        
        .progress-fill {
            width: 100%;
            height: 100%;
            background-color: theme('colors.primary');
            border-radius: 2px;
        }

        /* Hide scrollbar for clean horizontal scroll */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col font-body-base antialiased">
<!-- Top AppBar (Linear Flow, so no standard nav, just back/skip if needed) -->
<header class="fixed top-0 w-full z-200 bg-surface/80 backdrop-blur-xl flex justify-between items-center px-margin-mobile md:px-margin-desktop py-stack-sm border-b border-white/10 luminous-shadow">
<button aria-label="Go back" class="text-on-surface-variant hover:opacity-70 transition-opacity active:scale-95 p-2 -ml-2 rounded-full">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<span class="font-title-sm text-title-sm text-primary">Step 3 of 3</span>
<button aria-label="Skip this step" class="text-on-surface-variant font-caption-xs text-caption-xs hover:opacity-70 transition-opacity p-2 -mr-2 rounded-full">
            Skip
        </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-24 pb-32 px-margin-mobile md:px-margin-desktop max-w-container-max mx-auto w-full flex flex-col gap-stack-lg">
<!-- Header Section -->
<section class="text-center md:text-left pt-stack-sm">
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-on-surface mb-stack-sm tracking-tighter">Choose Your Favorite Colors</h1>
<p class="font-body-base text-body-base text-on-surface-variant max-w-lg mx-auto md:mx-0">We'll recommend wallpapers based on your color preferences.</p>
</section>
<!-- Color Selection Grid -->
<section class="w-full">
<div class="grid grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-gutter md:gap-stack-md justify-items-center">
<!-- Black -->
<div aria-checked="false" class="color-option w-16 h-16 md:w-20 md:h-20 rounded-full bg-black shadow-sm flex items-center justify-center" onclick="toggleColor(this)" role="checkbox" tabindex="0">
<span class="material-symbols-outlined check-icon text-white text-3xl">check</span>
</div>
<!-- White -->
<div aria-checked="false" class="color-option w-16 h-16 md:w-20 md:h-20 rounded-full bg-white border border-outline-variant shadow-sm flex items-center justify-center" onclick="toggleColor(this)" role="checkbox" tabindex="0">
<span class="material-symbols-outlined check-icon text-black text-3xl">check</span>
</div>
<!-- Red -->
<div aria-checked="false" class="color-option w-16 h-16 md:w-20 md:h-20 rounded-full bg-red-500 shadow-sm flex items-center justify-center" onclick="toggleColor(this)" role="checkbox" tabindex="0">
<span class="material-symbols-outlined check-icon text-white text-3xl">check</span>
</div>
<!-- Blue -->
<div aria-checked="false" class="color-option w-16 h-16 md:w-20 md:h-20 rounded-full bg-blue-500 shadow-sm flex items-center justify-center" onclick="toggleColor(this)" role="checkbox" tabindex="0">
<span class="material-symbols-outlined check-icon text-white text-3xl">check</span>
</div>
<!-- Purple -->
<div aria-checked="false" class="color-option w-16 h-16 md:w-20 md:h-20 rounded-full bg-purple-500 shadow-sm flex items-center justify-center" onclick="toggleColor(this)" role="checkbox" tabindex="0">
<span class="material-symbols-outlined check-icon text-white text-3xl">check</span>
</div>
<!-- Pink -->
<div aria-checked="false" class="color-option w-16 h-16 md:w-20 md:h-20 rounded-full bg-pink-400 shadow-sm flex items-center justify-center" onclick="toggleColor(this)" role="checkbox" tabindex="0">
<span class="material-symbols-outlined check-icon text-white text-3xl">check</span>
</div>
<!-- Gold/Yellow -->
<div aria-checked="false" class="color-option w-16 h-16 md:w-20 md:h-20 rounded-full bg-yellow-400 shadow-sm flex items-center justify-center" onclick="toggleColor(this)" role="checkbox" tabindex="0">
<span class="material-symbols-outlined check-icon text-white text-3xl">check</span>
</div>
<!-- Green -->
<div aria-checked="false" class="color-option w-16 h-16 md:w-20 md:h-20 rounded-full bg-emerald-400 shadow-sm flex items-center justify-center" onclick="toggleColor(this)" role="checkbox" tabindex="0">
<span class="material-symbols-outlined check-icon text-white text-3xl">check</span>
</div>
</div>
</section>
<!-- Device Selection -->
<section class="mt-stack-sm md:mt-stack-md">
<h2 class="font-headline-md-mobile text-headline-md-mobile md:font-headline-md md:text-headline-md text-on-surface mb-stack-md">What Device Are You Using?</h2>
<div class="grid grid-cols-2 md:grid-cols-4 gap-gutter">
<!-- iPhone -->
<div aria-checked="false" class="device-card p-6 rounded-[24px] bg-surface-container-lowest flex flex-col items-center justify-center gap-stack-sm" onclick="selectDevice(this)" role="radio" tabindex="0">
<span class="material-symbols-outlined device-icon text-on-surface-variant text-4xl" style="font-variation-settings: 'FILL' 0;">smartphone</span>
<span class="font-caption-xs text-caption-xs font-semibold text-center">iPhone</span>
</div>
<!-- Samsung -->
<div aria-checked="false" class="device-card p-6 rounded-[24px] bg-surface-container-lowest flex flex-col items-center justify-center gap-stack-sm" onclick="selectDevice(this)" role="radio" tabindex="0">
<span class="material-symbols-outlined device-icon text-on-surface-variant text-4xl" style="font-variation-settings: 'FILL' 0;">phone_android</span>
<span class="font-caption-xs text-caption-xs font-semibold text-center">Samsung</span>
</div>
<!-- Google Pixel -->
<div aria-checked="false" class="device-card p-6 rounded-[24px] bg-surface-container-lowest flex flex-col items-center justify-center gap-stack-sm" onclick="selectDevice(this)" role="radio" tabindex="0">
<span class="material-symbols-outlined device-icon text-on-surface-variant text-4xl" style="font-variation-settings: 'FILL' 0;">devices</span>
<span class="font-caption-xs text-caption-xs font-semibold text-center">Pixel</span>
</div>
<!-- Nothing -->
<div aria-checked="false" class="device-card p-6 rounded-[24px] bg-surface-container-lowest flex flex-col items-center justify-center gap-stack-sm" onclick="selectDevice(this)" role="radio" tabindex="0">
<span class="material-symbols-outlined device-icon text-on-surface-variant text-4xl" style="font-variation-settings: 'FILL' 0;">ad_units</span>
<span class="font-caption-xs text-caption-xs font-semibold text-center">Nothing</span>
</div>
</div>
</section>
</main>
<!-- Bottom Action Area (Floating) -->
<div class="fixed bottom-0 left-0 w-full p-margin-mobile md:p-margin-desktop bg-gradient-to-t from-background via-background/90 to-transparent z-100 flex justify-center pb-8 md:pb-12 pointer-events-none">
<button class="pointer-events-auto w-full max-w-md h-[64px] bg-primary text-on-primary rounded-full font-title-sm text-title-sm flex items-center justify-center shadow-[0_20px_50px_rgba(129,39,207,0.25)] hover:bg-surface-tint hover:-translate-y-1 active:scale-95 transition-all duration-300">
            Continue
        </button>
</div>
<script>
        // Multi-select for colors
        function toggleColor(element) {
            element.classList.toggle('selected');
            const isChecked = element.getAttribute('aria-checked') === 'true';
            element.setAttribute('aria-checked', !isChecked);
        }

        // Single-select for devices
        function selectDevice(element) {
            // Remove selected class from all device cards
            const allDevices = document.querySelectorAll('.device-card');
            allDevices.forEach(el => {
                el.classList.remove('selected');
                el.setAttribute('aria-checked', 'false');
            });

            // Add selected class to clicked card
            element.classList.add('selected');
            element.setAttribute('aria-checked', 'true');
        }

        // Add keyboard support for accessibility
        document.querySelectorAll('[role="checkbox"], [role="radio"]').forEach(el => {
            el.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    if (el.getAttribute('role') === 'checkbox') {
                        toggleColor(el);
                    } else {
                        selectDevice(el);
                    }
                }
            });
        });
    </script>
</body></html>
