<style>
        body {
            background-color: theme('colors.surface-container-lowest');
            color: theme('colors.on-surface');
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Subtle pulsing glow for floating elements */
        @keyframes float-glow {
            0% { transform: translateY(0px); box-shadow: 0 40px 80px -10px rgba(129, 39, 207, 0.03); }
            50% { transform: translateY(-10px); box-shadow: 0 60px 100px -10px rgba(129, 39, 207, 0.08); }
            100% { transform: translateY(0px); box-shadow: 0 40px 80px -10px rgba(129, 39, 207, 0.03); }
        }

        .floating-element {
            animation: float-glow 6s ease-in-out infinite;
        }
        
        .floating-element-delayed {
            animation: float-glow 7s ease-in-out infinite;
            animation-delay: 1.5s;
        }
        
        .floating-element-fast {
            animation: float-glow 5s ease-in-out infinite;
            animation-delay: 0.5s;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="antialiased overflow-hidden">
<!-- Suppress Main Nav Shell for Onboarding/Linear flow as per instructions -->
<!-- Top Progress Bar Container -->
<header class="w-full px-margin-mobile md:px-margin-desktop py-stack-md flex justify-between items-center z-50">

<span class="material-symbols-outlined">arrow_back</span>
</button>

<span class="font-caption-xs text-caption-xs text-outline mb-2">Step 1 of 3</span>
<div class="flex gap-2">
<div class="w-8 h-1 rounded-full bg-primary"></div>
<div class="w-8 h-1 rounded-full bg-surface-variant"></div>
<div class="w-8 h-1 rounded-full bg-surface-variant"></div>
</div>
</div>
<!-- Skip Action -->
<button class="font-caption-xs text-caption-xs text-on-surface-variant hover:text-primary transition-colors">
            Skip
        </button>
</header>
<!-- Main Content Area -->

</div>
