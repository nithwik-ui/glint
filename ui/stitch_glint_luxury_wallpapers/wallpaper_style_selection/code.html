<script>
        // Simple script to handle selection toggling for demonstration
        document.querySelectorAll('.style-card').forEach(card => {
            card.addEventListener('click', function() {
                // Deselect all
                document.querySelectorAll('.style-card').forEach(c => {
                    c.classList.remove('selected');
                    const icon = c.querySelector('.material-symbols-outlined.text-\\[20px\\]');
                    const iconContainer = c.querySelector('.rounded-full.opacity-100');
                    if(iconContainer) {
                        iconContainer.classList.remove('bg-primary', 'opacity-100');
                        iconContainer.classList.add('bg-white/20', 'opacity-0');
                    }
                    if(icon) {
                        icon.textContent = 'add';
                        icon.style.fontVariationSettings = '';
                    }
                });

                // Select clicked
                this.classList.add('selected');
                const icon = this.querySelector('.material-symbols-outlined.text-\\[20px\\]');
                const iconContainer = this.querySelector('.rounded-full');
                
                if(iconContainer) {
                    iconContainer.classList.remove('bg-white/20', 'opacity-0');
                    iconContainer.classList.add('bg-primary', 'opacity-100');
                }
                
                if(icon) {
                    icon.textContent = 'check';
                    icon.style.fontVariationSettings = "'FILL' 1";
                }
            });
        });
    </script>
